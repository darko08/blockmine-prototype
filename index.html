<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Blockmine Prototype</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="preconnect" href="https://mempool.space">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&display=swap">
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #efe8da; overflow: hidden;
    font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 400; -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; touch-action: none; -webkit-tap-highlight-color: transparent; }
  #game { position: fixed; inset: 0; }
  #game canvas { display: block; touch-action: none; }
  #hud { position: fixed; inset: 0; pointer-events: none; padding: max(10px, env(safe-area-inset-top)) 12px max(12px, env(safe-area-inset-bottom)); box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between; }
  .row { display: flex; gap: 8px; align-items: flex-start; justify-content: space-between; }
  .stat { border: 1px solid #b08d57; box-shadow: inset 0 0 0 3px rgba(0,0,0,.7), inset 0 0 0 4px rgba(176,141,87,.4); padding: 6px 12px 5px; min-width: 70px; background: rgba(0,0,0,.6); }
  .stat b { display: block; font-size: 28px; font-weight: 300; line-height: 1.05; }
  .stat span { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: #b08d57; }
  #risk { text-align: right; font-size: 15px; line-height: 1.2; color: #cfc6b5; max-width: 46%; text-shadow: 0 1px 3px #000; }
  #risk b { font-size: 30px; font-weight: 300; color: #ffb547; display: block; }
  #msg { align-self: center; text-align: center; font-size: 19px; text-shadow: 0 1px 4px #000; color: #cfc6b5; min-height: 20px; padding: 0 8px; }
  #test { width: fit-content; margin-left: auto; margin-right: auto; color: #000; background: #ffb547; font-size: 12px; padding: 2px 8px; letter-spacing: .08em; display: none; margin-top: 6px; }
  button { pointer-events: auto; font: inherit; color: #efe8da; background: rgba(0,0,0,.6); border: 1px solid #b08d57; box-shadow: inset 0 0 0 3px rgba(0,0,0,.7), inset 0 0 0 4px rgba(176,141,87,.4); padding: 11px 18px; font-size: 18px; letter-spacing: .04em; touch-action: manipulation; }
  button:active { background: #3a2c12; }
  #overlay { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; flex-direction: column; background: rgba(0,0,0,.82); text-align: center; z-index: 5; }
  #overlay h1 { font-weight: 300; font-size: 40px; color: #ffb547; margin: 0 0 8px; letter-spacing: .04em; }
  #overlay p { margin: 4px 16px; color: #bdb4a2; }
  #overlay button { margin-top: 18px; }
  #records { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(0,0,0,.86); z-index: 6; }
  #records .box { border: 1px solid #b08d57; box-shadow: inset 0 0 0 4px #000, inset 0 0 0 5px rgba(176,141,87,.4); font-size: 18px; padding: 18px 22px; min-width: 240px; }
  #records table { width: 100%; border-collapse: collapse; margin: 8px 0 14px; }
  #records td { padding: 5px 0; } #records td:last-child { text-align: right; color: #ffb547; }
  #records .btns { display: flex; gap: 8px; flex-wrap: wrap; }
</style>
</head>
<body>
<div id="game"></div>
<div id="hud">
  <div>
    <div class="row">
      <div class="row">
        <div class="stat"><span>Oil</span><b id="oil">100</b></div>
        <div class="stat"><span id="bagLabel">Bag</span><b id="bag">0</b></div>
      </div>
      <div id="risk"><b id="riskNum">0%</b>chance a block lands before you reach the hatch, if you leave now</div>
    </div>
    <div id="test">TEST MODE · simulated blocks about 1 minute apart</div>
  </div>
  <div id="msg">Connecting to the Bitcoin chain…</div>
  <div class="row">
    <button id="drop">Drop ore</button>
    <button id="recBtn">Record</button>
  </div>
</div>
<div id="overlay"><h1 id="ovTitle"></h1><p id="ovText"></p><button id="ovBtn">Back to the hatch</button></div>
<div id="records"><div class="box">
  <div style="font-size:20px">Your record <span id="recMode" style="font-size:12px;color:#a89f8e"></span></div>
  <table>
    <tr><td>Shifts</td><td id="rShifts">0</td></tr>
    <tr><td>Deepest level</td><td id="rDeep">0</td></tr>
    <tr><td>Times caught</td><td id="rCaught">0</td></tr>
    <tr><td>Total points</td><td id="rPoints">0</td></tr>
  </table>
  <div class="btns"><button id="recClose">Close</button><button id="modeBtn">Test mode</button></div>
</div></div>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<script src="settings.js?v=2"></script>
<script src="js/rng.js?v=2"></script>
<script src="js/sound.js?v=2"></script>
<script src="js/chain.js?v=2"></script>
<script src="js/records.js?v=2"></script>
<script src="js/art.js?v=2"></script>
<script src="js/game.js?v=2"></script>
</body>
</html>
