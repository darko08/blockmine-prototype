<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>One Bell</title>
<link rel="preconnect" href="https://mempool.space">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Playfair+Display:wght@500;600;700&display=swap">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; color: #efe8da;
    font-family: 'Cormorant Garamond', Georgia, serif; -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  /* the portrait frame: fills a phone, sits centred on a desktop */
  #frame { position: fixed; top: 0; bottom: 0; left: 50%; transform: translateX(-50%); overflow: hidden; background: #000; }
  #c { display: block; width: 100%; height: 100%; touch-action: manipulation; }
  #safe { position: fixed; visibility: hidden; pointer-events: none;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom) 0; }
  /* the font has to be used once before the canvas can draw with it */
  #fontWarm { position: absolute; left: -999px; top: 0; font-weight: 700; }
</style>
</head>
<body>
<div id="frame"><canvas id="c" aria-label="One Bell"></canvas></div>
<div id="safe"></div>
<span id="fontWarm">0 <b style="font-weight:500">a</b> <b style="font-weight:600">a</b> <i style="font-family:'Playfair Display';font-style:normal;font-weight:700">0</i><i style="font-family:'Playfair Display';font-style:normal;font-weight:500">1</i><i style="font-family:'Playfair Display';font-style:normal;font-weight:600">2</i></span>
<script>
  // the live Bitcoin feed is shared with the other versions (js/chain.js reads these)
  window.SETTINGS = {
    testBlockSeconds: 60,          // ?test=1: fake bell, exponential, this mean
    feedStaleSeconds: 45,
    feedReconnectSeconds: 5,
    mempoolSocket: 'wss://mempool.space/api/v1/ws',
    mempoolApi: 'https://mempool.space/api',
  };
</script>
<script src="../js/rng.js?v=5"></script>
<script src="../js/chain.js?v=6"></script>
<script src="village_fx.js?v=3"></script>
<script src="village.js?v=5"></script>
<script src="game.js?v=19"></script>
</body>
</html>
